<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Set-up</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <!-- Boxicons (local — avoids CORS on file://) -->
    <link rel="stylesheet" href="../boxicons/css/boxicons.min.css">
</head>
<body>
    <!-- SIDEBAR -->
    <section id="sidebar"></section>
    <!-- SIDEBAR -->

    <!-- CONTENT -->
    <section id="content">
        <!-- NAVBAR -->
        <nav>
            <i class='bx bx-menu bx-sm' role="button" tabindex="0" aria-label="Toggle sidebar"></i>
            <input type="checkbox" class="checkbox" id="switch-mode" hidden />
            <label class="switch-lm" for="switch-mode" aria-label="Toggle dark mode">
                <i class="bx bxs-moon"></i>
                <i class="bx bx-sun"></i>
                <div class="ball"></div>
            </label>
        </nav>
        <!-- NAVBAR -->

        <!-- MAIN -->
        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Categories Set-up</h1>
                    <ul class="breadcrumb">
                        <li><a href="../home.html">Home</a></li>
                        <li><i class='bx bx-chevron-right'></i></li>
                        <li><a class="active" href="#">Categories</a></li>
                    </ul>
                </div>
            </div>

            <!-- Settings Cards -->
            <ul class="box-option">
                <li>
                    <div class="bx"><i class="bx bxc-game-type"></i></div>
                    <div class="text">
                        <h3>Game Type</h3>
                        <div class="radio-group">
                            <label><input type="radio" name="game-type" value="sort" checked> Sort</label>
                            <label><input type="radio" name="game-type" value="label"> Label</label>
                            <label><input type="radio" name="game-type" value="compare"> Compare</label>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="bx"><i class="bx bxc-questions"></i></div>
                    <div class="text">
                        <h3>Questions: <span id="max-questions-value">3</span></h3>
                        <input type="range" id="max-questions" min="1" max="10" value="3" step="1">
                        
                    </div>
                </li>
                <li>
                    <div class="bx"><i class="bx bxc-fieldsize"></i></div>
                        <div class="text" id="field-size-group" style="display:none;">
                            <label for="field-size" style="font-size:.88rem;font-weight:600;color:var(--dark);">Field Size: <span id="field-size-value">2</span></label>
                            <input type="range" id="field-size" min="2" max="3" value="2" step="1">
                        </div>
                </li>
            </ul>

            <!-- Categories + Pupil -->
            <div class="table-data">
                <div class="order">
                    <div class="head" id="cats-order-head">
                        <h3 id="cats-order-label">Categories</h3>
                        <button id="openProgramModal" class="btn-secondary">Manage Programs</button>
                    </div>

                    <!-- Sort / Label: user-defined program categories -->
                    <div id="categories-section">
                        <!-- Category A -->
                        <div class="category-slot" id="slot-0">
                            <h3>Category A</h3>
                            <div class="form-group">
                                <select id="program-select-0" class="program-select-slot">
                                    <option value="">-- Select Program --</option>
                                </select>
                            </div>
                            <div class="form-group" id="stimulus-group-0" style="display:none;">
                                <label>Targets (optional):</label>
                                <div id="stimulus-list-0" class="checkbox-list"></div>
                                <p class="hint">Selected: <span id="selected-count-0">0</span>/5</p>
                            </div>
                        </div>

                        <!-- Category B -->
                        <div class="category-slot" id="slot-1">
                            <h3>Category B</h3>
                            <div class="form-group">
                                <select id="program-select-1" class="program-select-slot">
                                    <option value="">-- Select Program --</option>
                                </select>
                            </div>
                            <div class="form-group" id="stimulus-group-1" style="display:none;">
                                <label>Targets (optional):</label>
                                <div id="stimulus-list-1" class="checkbox-list"></div>
                                <p class="hint">Selected: <span id="selected-count-1">0</span>/5</p>
                            </div>
                        </div>

                        <!-- Category C (hidden until added) -->
                        <div class="category-slot" id="slot-2" style="display:none;">
                            <h3>Category C</h3>
                            <div class="form-group">
                                <select id="program-select-2" class="program-select-slot">
                                    <option value="">-- Select Program --</option>
                                </select>
                            </div>
                            <div class="form-group" id="stimulus-group-2" style="display:none;">
                                <label>Targets (optional):</label>
                                <div id="stimulus-list-2" class="checkbox-list"></div>
                                <p class="hint">Selected: <span id="selected-count-2">0</span>/5</p>
                            </div>
                        </div>

                        <button id="add-cat-btn" class="btn-secondary" style="display:none;">+ Add Category C</button>
                    </div>

                    <!-- Compare: built-in concept programs — replaces categories section -->
                    <div id="compare-section" style="display:none;">
                        <label style="font-size:.88rem;font-weight:600;color:var(--dark);">Choose concepts (select one or more):</label>
                        <div id="compare-program-list" class="checkbox-list"></div>
                        <p class="hint">Selected: <span id="compare-selected-count">0</span></p>
                    </div>
                </div>

                <div class="todo">
                    <div class="head">
                        <h3>Pupil</h3>
                    </div>
                    <select id="pupil-select">
                        <option value="">-- Select Pupil --</option>
                    </select>
                    <div class="input-button-group">
                        <input type="text" id="new-pupil-name" placeholder="Add new pupil…">
                        <button id="add-pupil-btn" class="btn-secondary">Add</button>
                    </div>
                </div>
            </div>

            <div class="start-session-wrap">
                <button id="start-btn" class="btn-primary" disabled>Start Quiz</button>
            </div>

            <!-- Program Management Modal -->
            <div id="programModal" class="modal hidden">
                <div class="modal-content">
                    <span id="closeModal" class="close">&times;</span>
                    <h2>Manage Programs</h2>
                    <div class="tab-buttons">
                        <button id="tabAdd" class="active">➕ Add Program</button>
                        <button id="tabEdit">✏️ Edit Program</button>
                    </div>
                    <section id="addProgramSection" class="tab-section show">
                        <form id="programForm">
                            <label>Program Name:</label>
                            <input type="text" placeholder="e.g., Farm Animals" required />
                            <label class="label-inline">
                                <input type="checkbox" id="new-program-text-only" />
                                <span>Text-only program (no images needed for any target)</span>
                            </label>
                            <div id="stimuliContainer"></div>
                            <button type="button" class="btn-secondary" id="addStimulusBtn">+ Add Stimulus</button>
                            <button type="submit" class="btn-primary">Save Program</button>
                        </form>
                    </section>
                    <section id="editProgramSection" class="tab-section hidden">
                        Choose a Program to Edit:
                        <div class="form-group">
                            <select id="programSelectDropdown">
                                <option value="">-- Select Program --</option>
                            </select>
                        </div>
                        <div id="editStimuliContainer" class="edit-placeholder">
                            <p>Select a program above to view and edit its stimuli.</p>
                        </div>
                        <button type="button" class="btn-secondary" id="addEditStimulusBtn">Add Stimulus</button>
                        <button type="button" class="btn-primary" id="saveEditsBtn">Save Changes</button>
                    </section>
                </div>
            </div>
        </main>
        <!-- MAIN -->
    </section>
    <!-- CONTENT -->

    <script>var ASSET_BASE = '../';</script>
    <script src="../js/utils.js"></script>
    <script src="../data.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/program-manager.js"></script>
    <script src="../js/menu/core.js"></script>
    <script src="../js/compare-data.js"></script>
    <script src="../js/menu/cats.js"></script>
    <script src="../js/menu/programs-modal.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/ui.js"></script>
</body>
</html>
