<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../boxicons/css/boxicons.min.css">
</head>
<body>
    <!-- SIDEBAR -->
    <section id="sidebar"></section>

    <!-- CONTENT -->
    <section id="content">
        <nav>
            <i class='bx bx-menu bx-sm' role="button" tabindex="0" aria-label="Toggle sidebar"></i>
            <input type="checkbox" class="checkbox" id="switch-mode" hidden />
            <label class="switch-lm" for="switch-mode" aria-label="Toggle dark mode">
                <i class="bx bxs-moon"></i>
                <i class="bx bx-sun"></i>
                <div class="ball"></div>
            </label>
        </nav>

        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Programs</h1>
                    <ul class="breadcrumb">
                        <li><a href="../home.html">Home</a></li>
                        <li><i class='bx bx-chevron-right'></i></li>
                        <li><a class="active" href="#">Programs</a></li>
                    </ul>
                </div>
            </div>

            <div class="programs-page-panel">
                <!-- Tabs -->
                <div class="tab-buttons">
                    <button id="tabAdd" class="active">➕ Add Program</button>
                    <button id="tabEdit">✏️ Edit Program</button>
                </div>
                <span id="save-toast" class="save-toast"></span>

                <!-- Add Program -->
                <section id="addProgramSection" class="tab-section show">
                    <form id="programForm">
                        <label>Program Name:</label>
                        <input type="text" placeholder="e.g., Farm Animals" required />
                        <label class="label-inline">
                            <input type="checkbox" id="new-program-text-only" />
                            <span>Text-only program (no images needed for any target)</span>
                        </label>
                        <div id="stimuliContainer"></div>
                        <button type="button" class="btn-secondary" id="addStimulusBtn">+ Add Stimulus</button>
                        <button type="submit" class="btn-primary">Save Program</button>
                    </form>
                </section>

                <!-- Edit Program -->
                <section id="editProgramSection" class="tab-section hidden">
                    Choose a Program to Edit:
                    <div class="form-group">
                        <select id="programSelectDropdown">
                            <option value="">-- Select Program --</option>
                        </select>
                    </div>
                    <div id="editStimuliContainer" class="edit-placeholder">
                        <p>Select a program above to view and edit its stimuli.</p>
                    </div>
                    <button type="button" class="btn-secondary" id="addEditStimulusBtn">Add Stimulus</button>
                    <button type="button" class="btn-primary" id="saveEditsBtn">Save Changes</button>
                </section>
            </div>
        </main>
    </section>

    <script>var ASSET_BASE = '../';</script>
    <script src="../js/utils.js"></script>
    <script src="../data.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/program-manager.js"></script>
    <script src="../js/menu/programs-modal.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/ui.js"></script>
</body>
</html>
