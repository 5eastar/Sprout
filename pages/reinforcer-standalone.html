<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinforcer</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/r+.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; width: 100vw; height: 100vh; overflow: hidden; }
        /* Target element for pond/window reinforcers */
        #end-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        /* Xylophone needs a centred background */
        body:has(#xylophone-reinforcer:not(.hidden)) {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #reinforcer-container.active {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 500;
            pointer-events: none;
        }
        #reinforcer-container.active > * { pointer-events: auto; }
        #reinforcer-container.active:has(#xylophone-reinforcer:not(.hidden)) {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <!-- required by pond/window reinforcers -->
    <div id="end-screen"></div>

    <div id="reinforcer-container" class="active">
        <div class="balloons" style="display:none;">
            <img src="images/animation/b1.png" alt="">
            <img src="images/animation/b2.png" alt="">
            <img src="images/animation/b3.png" alt="">
            <img src="images/animation/b4.png" alt="">
            <img src="images/animation/b5.png" alt="">
            <img src="images/animation/b6.png" alt="">
            <img src="images/animation/b7.png" alt="">
            <img src="images/animation/b8.png" alt="">
            <img src="images/animation/b1.png" alt="">
            <img src="images/animation/b2.png" alt="">
            <img src="images/animation/b3.png" alt="">
            <img src="images/animation/b4.png" alt="">
            <img src="images/animation/b5.png" alt="">
            <img src="images/animation/b6.png" alt="">
            <img src="images/animation/b7.png" alt="">
            <img src="images/animation/b8.png" alt="">
        </div>

        <canvas id="particleCanvas" style="display:none;"></canvas>

        <div id="xylophone-reinforcer" class="hidden">
            <div class="xy-song-select">
                <button class="btn-primary" data-song="hickory">Hickory Dickory Dock</button>
                <button class="btn-primary" data-song="baa">Baa Baa Black Sheep</button>
                <button class="btn-primary" data-song="twinkle">Twinkle Twinkle</button>
            </div>
            <div class="xy-keys"></div>
            <div class="xy-mallet"></div>
        </div>
    </div>

    <script>var ASSET_BASE = '../';</script>
    <script src="../js/confetti.browser.min.js"></script>
    <script src="../js/sounds.js"></script>
    <script src="../js/pondImage.js"></script>
    <script src="../js/reinforcer.js"></script>
    <script>
        const type = new URLSearchParams(location.search).get('type') || 'balloons';

        function launchReinforcer(reinforcerType) {
            const balloonsEl = document.querySelector('.balloons');
            const particleCanvas = document.getElementById('particleCanvas');

            switch (reinforcerType) {
                case 'balloons':
                    if (balloonsEl) balloonsEl.style.display = 'block';
                    if (typeof initializeBalloons === 'function') initializeBalloons();
                    break;
                case 'particles':
                    if (particleCanvas) particleCanvas.style.display = 'block';
                    if (typeof initializeParticles === 'function') initializeParticles();
                    break;
                case 'ballpit':
                    if (typeof initializeBallpit === 'function') initializeBallpit();
                    break;
                case 'pond':
                    if (typeof initializePond === 'function') initializePond();
                    break;
                case 'window':
                    if (typeof initializeWindow === 'function') initializeWindow();
                    break;
                case 'xylophone':
                    const xyEl = document.getElementById('xylophone-reinforcer');
                    if (xyEl) xyEl.classList.remove('hidden');
                    if (typeof initializeXylophone === 'function') initializeXylophone();
                    break;
            }
        }

        document.addEventListener('DOMContentLoaded', () => launchReinforcer(type));
    </script>
</body>
</html>
