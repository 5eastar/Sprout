<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/game.css">
    <link rel="stylesheet" href="../styles/phonics.css">
    <link rel="stylesheet" href="../styles/r+.css">
</head>
<body>
    <div class="container">
        <button id="teacher-btn" class="teacher-btn">T</button>
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>✰ Ready to Play? ✰</h1>
            <button class="btn-primary" id="begin-btn">
                Let's Go!
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="game-screen" class="screen" style="display:none;">
            <div class="game-top-bar">
                <div id="question-counter" class="question-counter"></div>
                <button id="sound-btn" class="sound-btn" title="Hear it again!">🔊</button>
            </div>
           
            <div id="question-text" class="question-text"></div>
            <div id="options-grid" class="options-grid">
            </div>
            <div id="feedback" class="feedback"></div>
            <div class="toggle">
                <input type="checkbox" id="btn">
                <label for="btn">
                    <span class="thumb"></span>
                </label>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen" style="display:none;">
            <h1> You did it!   </h1>
            <h1>✰ Great work ✰</h1>

            <!-- Reinforcer Selection Slider (inside end screen) -->
            <div id="reinforcer-selection" class="reinforcer-selection">
                <h2>Choose Your Reward!</h2>
                <div class="slider">
                    <div class="slide-track"></div>
                </div>
                <p class="carousel-hint">Tap a reward to choose!</p>
            </div>

            <button class="btn-primary" id="try-again-btn" onclick="window.location.reload()" style="position:fixed; top:50%; transform:translateY(-50%); left:0; right:0; margin:0 auto; width:fit-content; z-index:1000; display:none;">
                Try Again ⟲
            </button>
        </div>

        
    </div>

    <script>var ASSET_BASE = '../';</script>
    <script src="../js/confetti.browser.min.js"></script>
    <script src="../data.js"></script>
    <script src="../js/compare-data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/program-manager.js"></script>
    <script src="../js/sounds.js"></script>
    <script src="../js/pondImage.js"></script>
    <script src="../js/reinforcer.js"></script>
    <script src="../js/phonics/phAudio.js"></script>
    <script src="../js/game/core.js"></script>
    <script src="../js/game/timer.js"></script>
    <script src="../js/game/speech.js"></script>
    <script src="../js/game/ui.js"></script>
    <script src="../js/game/flow.js"></script>
    <script src="../js/game/programs.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => initStandardGame('identify-home.html'));</script>

</body>
</html>
