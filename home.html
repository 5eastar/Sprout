<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Games - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="boxicons/css/boxicons.min.css">
</head>
<body>
    <!-- SIDEBAR -->
    <section id="sidebar"></section>

    <!-- CONTENT -->
    <section id="content">
        <nav>
            <i class='bx bx-menu bx-sm' role="button" tabindex="0" aria-label="Toggle sidebar"></i>
            <input type="checkbox" class="checkbox" id="switch-mode" hidden />
            <label class="switch-lm" for="switch-mode" aria-label="Toggle dark mode">
                <i class="bx bxs-moon"></i>
                <i class="bx bx-sun"></i>
                <div class="ball"></div>
            </label>
        </nav>

        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Home</h1>
                    <ul class="breadcrumb">
                        <span class="text">
                        <p>Select a learning session to set up</p>
                        </span>
                    </ul>
                </div>
            </div>

            

            <div class="container">
                <div class="home-container">
                    <div class="game-selection">

                        <!-- Identify Game -->
                        <a href="pages/identify-home.html" class="game-card">
                            <div class="game-icon"><i class='bx bxc-grid-search' style="font-size:3.5rem;"></i></div>
                            <h2 class="game-title">Identify</h2>
                            <p class="game-description">Click to Find / Drag &amp; Drop to match target stimuli</p>
                        </a>

                        <!-- Categories Game -->
                        <a href="pages/cats-home.html" class="game-card">
                            <div class="game-icon"><i class='bx bxs-category' style="font-size:3.5rem;"></i></div>
                            <h2 class="game-title">Categories</h2>
                            <p class="game-description">Compare, sort, and label target categories</p>
                        </a>

                         <!-- Phonics Game -->
                        <a href="pages/phonics-home.html" class="game-card">
                            <div class="game-icon"><i class='bx bxc-open-book' style="font-size:3.5rem;"></i></div>
                            <h2 class="game-title">Phonics</h2>
                            <p class="game-description">Practice phonics skills in a group session</p>
                        </a>
                    </div>

                    <div class="teacher-tools">
                        <a href="pages/history.html" class="tool-btn">
                            <i class='bx bxs-group'></i> Pupil Data
                        </a>
                        <a href="pages/programs.html" class="tool-btn">
                            <i class='bx bxc-folder-cog'></i> Manage Programs
                        </a>
                        <a href="pages/reinforcers.html" class="tool-btn">
                            <i class='bx bxc-lightbulb'></i> Reinforcers
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
